<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Smart Vision</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="auth-container">
    <header class="app-header">
      <h1 class="brand-name">Smart<span>vision 회원가입</span></h1>
    </header>

    <form id="signupForm">
      <input type="email" id="signupEmail" placeholder="이메일" required />
      <input type="password" id="signupPassword" placeholder="비밀번호 (6자 이상 16자 미만)" required />
      <input type="text" id="deviceCode" placeholder="기기 고유코드 입력 (12자리)" maxlength="12" minlength="12" required />

    <div class="checkbox-group">
      <input type="checkbox" id="agreeTerms" required />
      <label for="agreeTerms" id="openTerms">개인정보 수집 및 이용약관에 동의합니다.</label>
    </div>

      
      <button type="submit">회원가입</button>
    </form>

    <p class="auth-link">
      이미 계정이 있으신가요? <a href="index.html">로그인</a>
    </p>

    <footer class="app-footer">
      <p>© 2025 Smart Vision. All rights reserved.</p>
    </footer>

    <div id="termsModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>이용약관</h2>
        <p>
          Smart Vision은 사용자 경험 향상을 위해 카메라 센서를 이용하여 실시간 시각 정보를 수집하고, <br>
          AI 기반 분석을 통해 개인화된 서비스를 제공합니다.<br><br>
          수집된 데이터는 서비스 개선 및 사용자 안전을 위한 목적으로만 사용되며,<br>
          외부로 절대 공유되지 않습니다.<br><br>
          이용자는 이에 대한 동의가 있어야 서비스를 이용할 수 있습니다.
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
